# Recompilation config for the hello example. The CMake build passes --elf and
# --out explicitly; these defaults are for running the tool by hand:
#
#   ps2-uncompiler assemble examples/hello/hello.s -o examples/hello/hello.elf
#   ps2-uncompiler recompile examples/hello/hello.toml
#   cmake -S examples/hello/out -B examples/hello/out/build && cmake --build examples/hello/out/build
#   examples/hello/out/build/hello --elf examples/hello/hello.elf

[input]
elf = "hello.elf"

[output]
dir = "out"
name = "hello"
mode = "multi"
comments = true

[analysis]
preempt_loops = true      # loop back-edges become safepoints (interrupts, thread switches)

[stubs]
auto = true               # "printf" binds to the runtime's printf stub
